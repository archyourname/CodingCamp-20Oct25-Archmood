<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portal PontMedusa</title>

    <link
        rel="stylesheet"
        href="./css/index.css"
    >

</head>


<body>

<div id="app">

    <div class="computer-scene">

        <div
            class="computer"
            onclick="openHome()"
        >

            <div class="monitor">

                <div class="screen"></div>

            </div>

            <div class="stand"></div>

            <div class="base"></div>

        </div>

    </div>


    <div class="instruction">
        🐱 Klik untuk Interaksi
    </div>

</div>


<script>

function openHome() {

    sessionStorage.setItem(
        "fromComputer",
        "true"
    );

    document
        .querySelector(".computer-scene")
        .classList.add("zoom-out");

    document
        .querySelector(".instruction")
        .classList.add("hide");

    setTimeout(() => {

        window.location.href =
            "./home.html";

    }, 1200);

}

</script>

</body>

</html>
